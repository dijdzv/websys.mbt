name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: mise run install
      - run: mise run check
      - run: mise run fmt-check
      - name: Install Chromium and its Linux dependencies
        run: mise exec -- node test/node_modules/playwright/cli.js install --with-deps chromium
      - run: mise run test
