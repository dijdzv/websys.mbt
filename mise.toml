[tools]
bun = "1.3.14"
node = "26.8.1"

[env]
MOON_HOME = "{{config_root}}/.tools/moonbit"
_.path = ["{{config_root}}/.tools/moonbit/bin"]

[tasks.generate]
run = ['"{{env.MOON_HOME}}/bin/moon" -C generator build --target js --release --deny-warn', '"{{env.MOON_HOME}}/bin/moon" run scripts/generate.mbtx']

[tasks.setup]
description = "Install the pinned Windows x64 MoonBit compiler and core with mise"
run = [
  'mise install-into "http:websys-moonbit[url=https://cli.moonbitlang.com/binaries/0.10.12%2B1634b282e/moonbit-windows-x86_64.zip,checksum=sha256:3e5449e862d4979b2fc64e6a248ec5babbd110440c8f2a7bf813c6fa01d8581f]@0.10.12" .tools/moonbit',
  'mise install-into "http:websys-core[url=https://cli.moonbitlang.com/cores/core-0.10.12%2B1634b282e.zip,checksum=sha256:f770d1f314f4aa88389e854c7e76814a534a2d84e93fe33e1737a516614d327f]@0.10.12" .tools/moonbit/lib/core',
  '"{{env.MOON_HOME}}/bin/moon" -C .tools/moonbit/lib/core bundle --all',
  '"{{env.MOON_HOME}}/bin/moon" update',
]

[tasks.check]
run = ['"{{env.MOON_HOME}}/bin/moon" check --target js --deny-warn', '"{{env.MOON_HOME}}/bin/moon" -C generator check --target js --deny-warn']

[tasks.test]
run = ['"{{env.MOON_HOME}}/bin/moon" -C generator test --target js', '"{{env.MOON_HOME}}/bin/moon" -C test build --target js --release --deny-warn', "node test/run.mjs"]
