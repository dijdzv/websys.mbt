[task_config]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -e -c{% endif %}"

[vars]
compiler_archive = "{% if arch() != 'x64' %}{{throw(message='Supported setup platforms: Windows/Linux x64')}}{% endif %}{% if os() == 'windows' %}moonbit-windows-x86_64.zip{% elif os() == 'linux' %}moonbit-linux-x86_64.tar.gz{% else %}{{throw(message='Supported setup platforms: Windows/Linux x64')}}{% endif %}"
compiler_sha = "{% if os() == 'windows' %}faae225a8287d0ce69e44b5b3f754af988e97f4446056d8f32ceb3ddb998fce7{% else %}9226694de9ff978db1ecf820b7710c4224e84ec7a76b19a222d96f0cd4e31b6a{% endif %}"

[tools]
bun = "1.3.14"
node = "26.8.1"
"github:dijdzv/moon-release" = "0.4.0"

[env]
MOON_HOME = "{{config_root}}/.tools/moonbit"
_.path = ["{{config_root}}/.tools/moonbit/bin"]

[tasks.generate]
run = ['"{{env.MOON_HOME}}/bin/moon" -C generator build --target js --release --deny-warn', '"{{env.MOON_HOME}}/bin/moon" run scripts/generate.mbtx']

[tasks.setup]
description = "Install the pinned MoonBit compiler and core (Windows/Linux x64)"
run = [
  'mise install-into --yes "http:websys-moonbit[url=https://cli.moonbitlang.com/binaries/0.10.14%2B7d59c7ec9/{{vars.compiler_archive}},checksum=sha256:{{vars.compiler_sha}}]@0.10.14" .tools/moonbit',
  'mise install-into --yes "http:websys-core[url=https://cli.moonbitlang.com/cores/core-0.10.14%2B7d59c7ec9.zip,checksum=sha256:63e5b99991ac8fd49556b1e17bdcbdc662d797000250dd11ef090f38a2175e84]@0.10.14" .tools/moonbit/lib/core',
  '{% if os() == "linux" %}chmod u+x .tools/moonbit/bin/*{% else %}"{{env.MOON_HOME}}/bin/moon" version{% endif %}',
  '"{{env.MOON_HOME}}/bin/moon" -C .tools/moonbit/lib/core bundle --all',
  '"{{env.MOON_HOME}}/bin/moon" update',
]

[tasks.check]
run = ['"{{env.MOON_HOME}}/bin/moon" check --target js --deny-warn', '"{{env.MOON_HOME}}/bin/moon" -C generator check --target js --deny-warn']

[tasks.test]
depends = ["test-getters"]
run = ['"{{env.MOON_HOME}}/bin/moon" -C generator test --target js', '"{{env.MOON_HOME}}/bin/moon" -C test build --target js --release --deny-warn', '"{{mise_bin}}" exec -- node test/run.mjs', '"{{mise_bin}}" run test-wasm', '"{{mise_bin}}" run test-async', '"{{mise_bin}}" run test-promises']

[tasks.install]
run = ['"{{mise_bin}}" exec -- bun install --frozen-lockfile', '"{{mise_bin}}" exec -- bun install --cwd test --frozen-lockfile']

[tasks."setup-test"]
depends = ["install"]
run = '"{{mise_bin}}" exec -- node test/node_modules/playwright/cli.js install chromium'

[tasks."build-test"]
run = '"{{env.MOON_HOME}}/bin/moon" -C test build --target js --release --deny-warn'

[tasks."test-run"]
run = '"{{mise_bin}}" exec -- node test/run.mjs'

[tasks."test-wasm"]
description = "Generate and verify the experimental WasmGC DOM subset in headless Chromium"
run = [
  '"{{env.MOON_HOME}}/bin/moon" -C generator build --target js --release --deny-warn',
  '"{{mise_bin}}" exec -- bun generator/_build/js/release/build/webidl-bindgen.js --wasm-gc-input test/wasm/dom.idl --wasm-gc-module dijdzv/websys-wasm-fixture -o test/wasm/generated',
  '"{{env.MOON_HOME}}/bin/moon" -C test/wasm build --target wasm-gc --release --deny-warn',
  '"{{mise_bin}}" exec -- node test/run.mjs --wasm-gc',
]

[tasks.fmt]
depends = ["fmt-getters"]
run = ['"{{env.MOON_HOME}}/bin/moon" fmt src', '"{{env.MOON_HOME}}/bin/moon" -C generator fmt src', '"{{env.MOON_HOME}}/bin/moon" -C test fmt src', '"{{env.MOON_HOME}}/bin/moon" -C test/wasm fmt check.mbt input_lifecycle.mbt buffer.mbt']

[tasks."test-getters"]
description = "Verify generated getter failures in headless Chromium"
run = [
  '"{{env.MOON_HOME}}/bin/moon" -C generator build --target js --release --deny-warn',
  '"{{mise_bin}}" exec -- bun generator/_build/js/release/build/webidl-bindgen.js --wasm-gc-input test/getter/api.idl --getter-errors test/getter/errors.json --wasm-gc-module dijdzv/websys-getter-fixture -o test/getter/generated',
  '"{{env.MOON_HOME}}/bin/moon" -C test/getter build --target wasm-gc --release --deny-warn',
  '"{{mise_bin}}" exec -- node test/getter/run.mjs',
]

[tasks."test-async"]
description = "Verify the pinned async candidate from a separate JS/WasmGC consumer"
run = [
  '"{{env.MOON_HOME}}/bin/moon" run scripts/prepare-async-wasmgc.mbtx',
  '"{{env.MOON_HOME}}/bin/moon" -C test/async build --target wasm-gc --release --deny-warn',
  '"{{env.MOON_HOME}}/bin/moon" -C test/async build --target js --release --deny-warn',
  '"{{mise_bin}}" exec -- node test/async/run.mjs test/async/_build/wasm-gc/release/build/dijdzv/websys-async-tests/websys-async-tests.wasm test/async/_build/js/release/build/dijdzv/websys-async-tests/websys-async-tests.js',
]

[tasks."test-promises"]
description = "Generate and verify WasmGC Promise methods through an external consumer"
run = [
  '"{{env.MOON_HOME}}/bin/moon" run scripts/prepare-async-wasmgc.mbtx',
  '"{{env.MOON_HOME}}/bin/moon" -C generator build --target js --release --deny-warn',
  '"{{mise_bin}}" exec -- bun generator/_build/js/release/build/webidl-bindgen.js --wasm-gc-input test/promise/api.idl --wasm-gc-module dijdzv/websys-promise-fixture -o test/promise/generated',
  '"{{env.MOON_HOME}}/bin/moon" -C test/promise build --target wasm-gc --release --deny-warn',
  '"{{mise_bin}}" exec -- node test/promise/run.mjs',
  '"{{env.MOON_HOME}}/bin/moon" run scripts/verify-result-diagnostics.mbtx',
  '"{{env.MOON_HOME}}/bin/moon" run scripts/verify-wasmgc-bundle.mbtx',
]

[tasks."fmt-check"]
depends = ["fmt-check-getters"]
run = ['"{{env.MOON_HOME}}/bin/moon" fmt --check src', '"{{env.MOON_HOME}}/bin/moon" -C generator fmt --check src', '"{{env.MOON_HOME}}/bin/moon" -C test fmt --check src', '"{{env.MOON_HOME}}/bin/moon" -C test/wasm fmt --check check.mbt input_lifecycle.mbt buffer.mbt']
[tasks."fmt-getters"]
run = '"{{env.MOON_HOME}}/bin/moon" -C test/getter fmt check.mbt'

[tasks."fmt-check-getters"]
run = '"{{env.MOON_HOME}}/bin/moon" -C test/getter fmt --check check.mbt'
