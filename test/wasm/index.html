<!doctype html>
<meta charset="utf-8">
<title>WasmGC browser binding tests</title>
<script type="module">
import { createImports } from './generated/runtime.mjs';
try {
  const response = await fetch('./_build/wasm-gc/release/build/dijdzv/websys-wasm-test/websys-wasm-test.wasm');
  if (!response.ok) throw new Error(`Wasm consumer build unavailable: ${response.status}`);
  const bytes = await response.arrayBuffer();
  for (let i = 0; i < 4; i++) {
    const { instance } = await WebAssembly.instantiate(bytes, createImports(), {
      builtins: ['js-string'], importedStringConstants: '_',
    });
    const result = instance.exports.run(document, new Event('click'));
    if (result !== 0) throw new Error(`WasmGC assertion ${result} failed (instance ${i})`);
    for (let mode = 0; mode < 3; mode++) {
      const value = instance.exports.dictionary_sample(mode, document);
      if (value.title !== '日本語😀' || value.requiredNote !== (mode === 2 ? '確定😀' : null)) throw new Error('Required dictionary values changed');
      if (mode === 0) {
        if (Object.hasOwn(value, 'node') || Object.hasOwn(value, 'note') || Object.hasOwn(value, 'enabled') || Object.hasOwn(value, 'count') || Object.hasOwn(value, 'unsignedCount')) throw new Error('Omitted fields became present');
      } else {
        if (value.note !== (mode === 1 ? null : '') || value.enabled !== false || value.count !== 0) throw new Error('Explicit dictionary values changed');
        if (value.unsignedCount !== (mode === 1 ? 2147483648 : 4294967295)) throw new Error('Unsigned dictionary value changed sign');
        if (mode === 1 ? value.node !== null : !(value.node instanceof Element && value.node.tagName === 'SPAN')) throw new Error('Dictionary reference changed');
      }
    }
    const api = instance.exports;
    const input = document.createElement(i % 2 === 0 ? 'input' : 'textarea');
    document.body.append(input);
    const nextFrames = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    try {
      if (api.input_is_focused(document, input)) throw new Error('Unfocused field reported focused');
      api.input_focus(input);
      if (!api.input_is_focused(document, input)) throw new Error('Focus identity was lost');
      api.input_start(window, input);
      input.value = '変換中';
      input.dispatchEvent(new InputEvent('input', { isComposing: true }));
      await nextFrames();
      if (api.input_frames() !== 0 || api.input_callbacks() !== 1) throw new Error('Composing input was applied');
      input.dispatchEvent(new CompositionEvent('compositionupdate', { data: 'あ😀' }));
      input.value = 'あ😀';
      await nextFrames();
      if (api.input_frames() !== 1 || !api.input_text_matches('あ😀')) throw new Error('Frame did not observe updated DOM');
      input.dispatchEvent(new InputEvent('input'));
      api.input_stop();
      input.value = 'disposed';
      input.dispatchEvent(new InputEvent('input'));
      await nextFrames();
      if (api.input_frames() !== 1 || api.input_callbacks() !== 3 || !api.input_text_matches('あ😀')) throw new Error('Disposed input mutated state');
      api.input_start(window, input);
      api.input_start(window, input);
      input.value = '再開';
      input.dispatchEvent(new InputEvent('input'));
      await nextFrames();
      if (api.input_frames() !== 2 || api.input_callbacks() !== 4 || !api.input_text_matches('再開')) throw new Error('Restart duplicated listeners');
    } finally { api.input_stop(); input.remove(); }
  }
  console.log('WasmGC DOM, Unicode, callback identity and input lifecycle: passed');
  window.__testsPassed = true;
} catch (error) {
  console.error(error.stack || String(error));
  window.__testsPassed = false;
} finally {
  window.__testsDone = true;
}
</script>
